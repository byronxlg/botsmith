name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * 1"   # weekly: external links rot between pushes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check local links and assets resolve
        run: |
          set -e
          for f in index.html 404.html; do
            for ref in $(grep -o '\(href\|src\)="[^"]*"' "$f" | sed 's/.*="\(.*\)"/\1/' | grep -v '^#' | grep -v '^[a-z]*:' | sed 's/[#?].*//' | sort -u); do
              case "$ref" in /*) t=".$ref";; *) t="$(dirname "$f")/$ref";; esac
              case "$t" in */) t="${t}index.html";; esac
              [ -f "$t" ] || { echo "$f: missing $ref"; exit 1; }
            done
          done
      - name: Check external links answer
        run: |
          set -e
          fail=0
          for u in $(grep -oh 'href="https\?://[^"]*"' index.html 404.html | sed 's/href="\(.*\)"/\1/' | sort -u); do
            code=$(curl -sS -o /dev/null -L -m 20 -A "botsmith-linkcheck" -w '%{http_code}' "$u" || echo 000)
            case "$code" in 2*|3*) ;; *) echo "BROKEN $code $u"; fail=1;; esac
          done
          [ "$fail" = 0 ]
      - if: github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
